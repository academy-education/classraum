name: CI

# The gate that was missing.
#
# Every typecheck, test run and build in this repo has historically been
# run by hand, which is how a commit that broke 9 tests reached main
# unnoticed. Nothing here is new tooling — it is the same three commands
# a careful person runs, made non-optional.
#
# Runs on PRs and on direct pushes to main, because this project does
# push straight to main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the older run — no point
# spending minutes verifying a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Next inlines NEXT_PUBLIC_* at build time, so `next build` needs
      # them present or it fails on import. These are deliberately fake:
      # CI must never hold real credentials, and nothing here talks to a
      # live service — the build only needs the values to be well-formed.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_PORTONE_STORE_ID: store-ci-placeholder
      NEXT_PUBLIC_PORTONE_CHANNEL_KEY_PAYMENT_LIVE: channel-ci-placeholder
      NEXT_PUBLIC_PORTONE_CHANNEL_KEY_BILLING_LIVE: channel-ci-placeholder
      # Belt and braces alongside the lazy client in
      # src/lib/level-test-generator.ts. A module-scope `new OpenAI()`
      # anywhere makes `next build` evaluate it while collecting page
      # data, and the SDK throws without a key. The lazy getter is the
      # real fix; this keeps the build honest if someone reintroduces
      # the pattern. Fake, like every other value here.
      OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
      # Keep telemetry out of CI runs.
      NEXT_TELEMETRY_DISABLED: '1'
      SENTRY_DSN: ''
      NEXT_PUBLIC_SENTRY_DSN: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the local toolchain. package.json allows >=18.17, but
          # the build is only actually exercised on 22 here.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Ordered cheapest-first so an obvious break fails in seconds
      # rather than after a multi-minute build.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest --ci

      - name: Production build
        run: npm run build

      - name: Lint
        # Advisory: the repo carries pre-existing warnings, so a lint
        # failure must not block a correctness fix. Errors still show in
        # the log. Flip to a hard gate once the backlog is cleared.
        run: npm run lint
        continue-on-error: true
